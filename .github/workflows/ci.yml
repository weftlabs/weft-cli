name: CI

# An inert docs-only diff (markdown, docs/, agent harness paths) skips the
# expensive work below. Load-bearing markdown stays non-inert: README.md and
# docs/contract.md are read by tests/docs-contract.test.ts and ship in the npm
# package; skills/** is read by the same test and checked by the required
# `drift` workflow. This repo is public and branch protection requires `ci`,
# so the check must stay present — the job still runs and reports success;
# only the gated steps are skipped.
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

# github.workflow stays in the group so CI, staging e2e, and release do not cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history so the base commit of a PR or push is present.
          fetch-depth: 0
      - name: Detect inert docs-only change
        id: scope
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          docs_only=true
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # Unknown base: fail open and run CI.
            docs_only=false
          else
            while IFS= read -r path; do
              case "$path" in
                # tests/docs-contract.test.ts reads these and they ship in the
                # npm package: keep CI on for them.
                README.md|docs/contract.md) docs_only=false; break ;;
                *.md|docs/*|.opencode/*) ;;
                *) docs_only=false; break ;;
              esac
            done < <(git diff --name-only "$base" HEAD)
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "inert docs-only diff: $docs_only"
      - name: Setup pnpm
        if: steps.scope.outputs.docs_only != 'true'
        uses: pnpm/action-setup@v6
      - name: Setup Node
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm run lint:check
      - name: Format check
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm run format:check
      - name: Typecheck
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm run typecheck
      - name: Build
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm run build
      - name: Unit tests
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm run test:unit
      - name: Packed artifact acceptance
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/test-packed-artifact.mjs
