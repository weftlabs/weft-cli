name: Staging E2E

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

# github.workflow stays in the group so CI, staging e2e, and release do not cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEFT_STAGING_BASE_URL: https://staging.weft.network
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Fork and Dependabot PRs never receive Actions secrets, so they skip. The
      # staging key stays out of Dependabot secrets on purpose. The smoke runs on
      # main after merge. Everywhere else a missing key fails: a silent skip on
      # main looks the same as a pass.
      - name: Require the staging secret outside fork and Dependabot PRs
        id: secret
        env:
          E2E_BUYER_API_KEY: ${{ secrets.E2E_BUYER_API_KEY }}
          NO_SECRETS: ${{ github.event.pull_request.head.repo.fork == true || github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          if [ -n "$E2E_BUYER_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$NO_SECRETS" = "true" ]; then
            echo "::notice::Fork or Dependabot PR: secrets are not available. Skipping the staging smoke."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::E2E_BUYER_API_KEY is not set for this repository. Set it before this check can pass."
          exit 1
      - name: Setup pnpm
        if: steps.secret.outputs.present == 'true'
        uses: pnpm/action-setup@v6
      - name: Setup Node
        if: steps.secret.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        if: steps.secret.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.secret.outputs.present == 'true'
        run: pnpm run build
      - name: Run staging smoke
        if: steps.secret.outputs.present == 'true'
        env:
          WEFT_API_KEY: ${{ secrets.E2E_BUYER_API_KEY }}
          WEFT_BASE_URL: https://staging.weft.network
        run: node scripts/e2e-staging.mjs
